name: Ad not blocked
description: An ad or tracker got through
labels: [missed-ad]
body:
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://example.com/article
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What did you see?
      description: Where on the page is the ad? A screenshot helps.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: AdShield and Chrome versions
      placeholder: AdShield 1.0.0, Chrome 131
