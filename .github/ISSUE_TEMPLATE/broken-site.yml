name: Site broken
description: A website doesn't work correctly with AdShield on
labels: [broken-site]
body:
  - type: input
    id: url
    attributes:
      label: Page URL
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is broken?
      description: Does it work after clicking "Turn off for this site"?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: AdShield and Chrome versions
      placeholder: AdShield 1.0.0, Chrome 131
